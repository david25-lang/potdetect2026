services:
  - type: web
    name: road-damage-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python download_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MODEL_YOLO_ONNX_URL
        value: "https://github.com/david25-lang/potdetect2026/releases/download/v1.0-models/best.onnx"
      - key: MODEL_CNN_ONNX_URL
        value: "https://github.com/david25-lang/potdetect2026/releases/download/v1.0-models/best_cnn_fp16.onnx"
